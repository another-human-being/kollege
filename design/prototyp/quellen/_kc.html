<sc-if value="{{kcOffen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Kollege fragen" style="position: absolute; top: 0; right: 0; bottom: 0; width: 480px; box-sizing: border-box; background: var(--paper); box-shadow: var(--shadow-sheet); border-left: 1px solid var(--rule); display: flex; flex-direction: column; z-index: 5">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 24px; border-bottom: 1px solid var(--rule)">
<b style="font-weight: 500">Kollege fragen</b>
<x-import component-from-global-scope="Kollege.Etikett">{{kcName}}</x-import>
<span style="flex-grow: 1"></span>
<a class="kg-aktion kg-aktion--text" href="Chat.dc.html" style="font-size: 13px">Im Chatverlauf</a>
<button type="button" class="x-knopf" onClick="{{kcZu}}" aria-label="Chat schließen" title="Schließen">×</button>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 16px 24px">
<sc-if value="{{kcLeer}}" hint-placeholder-val="{{ true }}">
<div class="ch-start">
<h2>Was möchtest du zu {{kcName}} wissen?</h2>
<span class="mono">Ich kenne: {{kcKontext}}</span>
<div class="ch-vorschlaege"><sc-for list="{{kcVorschlaege}}" as="v" hint-placeholder-count="3"><button type="button" class="ch-vorschlag" onClick="{{v.los}}">{{v.text}}</button></sc-for></div>
<span style="font-size: 13px; color: var(--ink-muted)">Oder notiere etwas – ich lege es im Verlauf ab.</span>
</div>
</sc-if>
<div class="ch">
<sc-for list="{{kcMsgs}}" as="m" hint-placeholder-count="2">
<sc-if value="{{m.istDu}}" hint-placeholder-val="{{ true }}"><div class="ch-du">{{m.text}}</div></sc-if>
<sc-if value="{{m.istKollege}}" hint-placeholder-val="{{ false }}"><div class="ch-ko"><span class="ch-wer">Kollege</span><div class="ch-ko-text">{{m.text}}</div></div></sc-if>
<sc-if value="{{m.istAussage}}" hint-placeholder-val="{{ false }}"><div class="ch-belege"><x-import component-from-global-scope="Kollege.Aussage" art="{{m.art}}" quelle="{{m.quelle}}">{{m.text}}</x-import></div></sc-if>
<sc-if value="{{m.istKarte}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kollege.Karte" punkte="{{m.punkte}}" privat="{{m.privat}}" folgen="{{m.folgen}}" link-text="{{m.linkText}}" link-href="{{m.linkHref}}"></x-import></sc-if>
<sc-if value="{{m.istLuecke}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kollege.Wissensluecke" bekannt="{{m.bekannt}}"></x-import></sc-if>
</sc-for>
<sc-if value="{{kcLaden}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kollege.Laden" inline="{{ true }}" text="Lese den Kontext"></x-import></sc-if>
</div>
</div>
<div style="padding: 12px 24px 16px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px">
<x-import component-from-global-scope="Kollege.Eingabe" id="kc-eingabe-2" platzhalter="{{kcPlatzhalter}}" on-senden="{{kcSenden}}"></x-import>
<label style="display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-muted)"><input type="checkbox" checked="{{kcPrivat}}" onChange="{{kcPrivatToggle}}"> Notiz nur für mich (privat)</label>
</div>
</div>
</sc-if>
