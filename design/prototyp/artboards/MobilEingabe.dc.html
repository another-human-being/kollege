<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Serif:ital,wght@1,400&amp;display=swap">
<style>
body{margin:0;background:#fbfbfa}
a:not([class]){color:inherit}
a.kg-aktion--primaer,a.kg-aktion--sekundaer{text-decoration:none}
.kg-seitennav{display:flex;flex-direction:column;gap:2px}
.kg-seitennav a{padding:4px 8px;border-radius:2px;color:var(--ink-muted);text-decoration:none;font-size:14px;line-height:20px}
.kg-seitennav a:hover{color:var(--ink)}
.kg-seitennav a[aria-current="page"]{color:var(--ink);background:var(--paper-sunk)}
.nav-luecke{display:block;height:12px}
.nav-gruppe{display:block;padding:14px 8px 4px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.kg-seitennav a.nav-plus{color:var(--ink-faint);font-size:13px}
.h1{margin:0;font-size:28px;line-height:34px;font-weight:500;letter-spacing:-0.01em}
.label{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.mono{font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--ink-muted)}
.ld{display:flex;height:100%}.ld-liste{width:380px;flex-shrink:0;border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}.ld-kopf{padding:20px 20px 12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}.ld-kopf h1{margin:0;font-size:20px;line-height:28px;font-weight:500}.ld-scroll{flex:1;overflow-y:auto;min-height:0}.ld-zeile{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;padding:10px 20px;border-bottom:1px solid var(--rule);cursor:pointer}.ld-zeile:hover{background:var(--paper-sunk)}.ld-zeile[aria-current="true"]{background:var(--paper-sunk);box-shadow:inset 2px 0 0 var(--ink)}.ld-zeile:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.ld-t{font-size:14px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ld-m{font-family:var(--font-mono);font-size:11px;line-height:16px;color:var(--ink-muted);white-space:nowrap}.ld-u{grid-column:1/-1;font-size:12px;line-height:16px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ld-gruppe{padding:14px 20px 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}.ld-detail{flex:1;min-width:0;overflow-y:auto;padding:28px 40px 96px;display:flex;flex-direction:column;gap:28px}.ld-leer{padding:40px}
.fe{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:2px;padding:3px 6px;margin-left:-7px;min-width:0;box-sizing:border-box}.fe:hover{border-color:var(--rule)}.fe:focus{outline:none;border-color:var(--accent);background:var(--paper)}textarea.fe{resize:vertical;line-height:22px}select.fe{cursor:pointer}.fe-titel{font-size:24px;line-height:32px;font-weight:500;width:100%}
.felder{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 16px;align-items:baseline}.felder>label,.felder>.fl{font-size:12px;line-height:28px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.such{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}.such:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.filterzeile{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.klein{font-size:12px}.chip{all:unset;cursor:pointer;font-size:12px;line-height:18px;padding:1px 8px;border:1px solid var(--line-control);border-radius:2px;color:var(--ink-muted)}.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.chip:focus-visible{outline:2px solid var(--accent)}
.ungeprueft-banner{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--line-control);border-radius:4px;font-size:14px}

.pz{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:start;border-bottom:1px solid var(--rule)}.pz .ld-zeile{border-bottom:0;padding-left:4px}.pz input{margin:14px 0 0 16px;accent-color:var(--ink)}
.kg-aktion{min-height:44px}.kg-nachricht{grid-template-columns:minmax(0,1fr)!important;row-gap:2px}.kg-nachricht-wer{flex-direction:row!important;gap:8px}.kg-entwurf-fuss .kg-aktion{flex-grow:1;justify-content:center}
</style>
</helmet>
<div class="kg" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; background: var(--paper); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="flex-grow: 1; min-width: 0; height: 100%; position: relative">
<div style="height: 844px; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 12px; border-bottom: 1px solid var(--rule)">
<a href="MobilUebersicht.dc.html" style="font-size: 14px; color: var(--ink-muted); text-decoration: none; min-height: 44px; display: flex; align-items: center">← Heute</a>
<span style="flex-grow: 1; font-weight: 500; font-size: 14px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{titel}}</span>
<x-import component-from-global-scope="Kollege.Privat" nur-symbol="{{ true }}"></x-import>
</header>
<div style="flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{leer}}" hint-placeholder-val="{{ true }}">
<div style="padding-top: 24px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 20px; line-height: 28px; font-weight: 500">Gerade aus dem Gespräch?</div>
<div style="font-size: 14px; color: var(--ink-muted)">Schreib in eigenen Worten, was passiert ist. Ich ordne zu, trage ein und zeige dir, was ich getan habe.</div>
</div>
</sc-if>
<sc-for list="{{nachrichten}}" as="m" hint-placeholder-count="3">
<sc-if value="{{m.istDu}}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="Kollege.Nachricht" von="du" zeit="jetzt">{{m.text}}</x-import></sc-if>
<sc-if value="{{m.istKollege}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kollege.Nachricht" von="kollege" streamt="{{m.streamt}}">{{m.text}}</x-import></sc-if>
<sc-if value="{{m.istKarte}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kollege.Karte" punkte="{{m.punkte}}" folgen="{{m.folgen}}" link-text="Zur Beratungsakte" link-href="Gruendungsteams.dc.html"></x-import></sc-if>
<sc-if value="{{m.istKlaerung}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kollege.Klaerung" frage="Ist „Frau Weber“ Anna Weber (IHK)?" grund="einzige Frau Weber in euren Kontakten" quelle="Mail 21.09." antworten="{{antworten}}" on-antwort="{{beantworten}}"></x-import></sc-if>
<sc-if value="{{m.istEntwurf}}" hint-placeholder-val="{{ false }}"><sc-if value="{{wartet}}" hint-placeholder-val="{{ true }}"><div class="mono">↑ wartet auf deine Antwort oben</div></sc-if><div style="{{wartetStil}}"><x-import component-from-global-scope="Kollege.Entwurf" kanal="Mail" an="Anna Weber, IHK" betreff="Vorstellung: Solaro" auszug="Liebe Frau Weber, darf ich Ihnen Lisa Meier und Tom Kraus von Solaro vorstellen? …" hinweis="Geht über dein Postfach, liegt danach in „Gesendet“." on-senden="{{m.senden}}"></x-import></div></sc-if>
<sc-if value="{{m.istGesendet}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kollege.Karte" titel="Gesendet" punkte="{{m.gesendetPunkte}}" folgen="nur 30 Sekunden möglich" on-rueckgaengig="{{m.senden}}"></x-import></sc-if>
</sc-for>
<sc-if value="{{laden}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kollege.Laden" inline="{{ true }}" text="Lese mit, ordne zu"></x-import></sc-if>
</div>
<div style="padding: 12px 12px 20px; border-top: 1px solid var(--rule)">
<x-import component-from-global-scope="Kollege.Eingabe" id="mobil-eingabe" wert="{{startText}}" hilfe="Notiz, Frage oder Anweisung" on-senden="{{senden}}"></x-import>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  kgChats() {
    return [
      { id: 'c1', titel: 'Beratung Solaro, Pitchdeck', datum: 'heute', etikett: 'Solaro', angepinnt: true, href: 'Chat.dc.html' },
      { id: 'c2', titel: 'Social Media nur montags', datum: 'heute', href: 'Chat.dc.html' },
      { id: 'c3', titel: 'Was haben wir Solaro versprochen?', datum: 'gestern', etikett: 'Solaro', href: 'Chat.dc.html' },
      { id: 'c4', titel: 'Einladung Gründungsnacht', datum: '28.09.', etikett: 'Gründungsnacht 2026', href: 'Chat.dc.html' },
      { id: 'c5', titel: 'Wie lange dauert EXIST?', datum: '25.09.', href: 'Chat.dc.html' },
      { id: 'c6', titel: 'Notiz zu Tom', datum: '24.09.', etikett: 'Tom Kraus', href: 'Chat.dc.html' }
    ];
  }
  kcState() { return { kcOffen: false, kcMsgs: [], kcStream: null, kcLaden: false, kcPrivat: false, kcNotizen: [] }; }
  kcCfg() { return { name: 'Eintrag', anzahl: '0 Einträge', platzhalter: 'Frag oder notiere etwas', antwort: '', belege: [], luecke: '' }; }
  kcSenden(text) {
    var self = this, cfg = this.kcCfg(), frage = text.indexOf('?') >= 0, privat = this.state.kcPrivat;
    this.setState({ kcOffen: true, kcLaden: true, kcMsgs: this.state.kcMsgs.concat([{ typ: 'du', text: text }]) });
    setTimeout(function () {
      var antwort = '', rest = [];
      if (frage && cfg.antwort && !/wie lange|dauer|chance/i.test(text)) {
        antwort = cfg.antwort;
        rest = cfg.belege.map(function (b) { return { typ: 'aussage', art: b.art, text: b.text, quelle: b.quelle }; });
      } else if (frage) {
        rest = [{ typ: 'luecke', bekannt: cfg.luecke }];
      } else {
        antwort = 'Notiert bei ' + cfg.name + (privat ? ' – privat, nur für dich sichtbar.' : '.');
        var punkte = ['Notiz im Verlauf von „' + cfg.name + '“ abgelegt' + (privat ? ' (privat)' : '')];
        var folgen = '';
        if (/ bis |frist|morgen|freitag|montag|nächste woche/i.test(text)) { punkte.push('Aufgabe für dich angelegt: ' + (text.length > 52 ? text.slice(0, 52) + '…' : text)); folgen = 'entfernt auch 1 Aufgabe'; }
        rest = [{ typ: 'karte', punkte: punkte, privat: privat, folgen: folgen, linkText: 'Im Verlauf ansehen', linkHref: '#verlauf' }];
        self.setState({ kcNotizen: [{ text: text, privat: privat }].concat(self.state.kcNotizen) });
      }
      self.kcStreamen(antwort, rest);
    }, 800);
  }
  kcStreamen(voll, rest) {
    var self = this;
    if (!voll) { this.setState({ kcLaden: false, kcMsgs: this.state.kcMsgs.concat(rest) }); return; }
    this.setState({ kcLaden: false, kcStream: { voll: voll, n: 0, rest: rest } });
    var t = setInterval(function () {
      var s = self.state.kcStream;
      if (!s) { clearInterval(t); return; }
      var n = Math.min(s.voll.length, s.n + 4);
      if (n >= s.voll.length) { clearInterval(t); self.setState({ kcStream: null, kcMsgs: self.state.kcMsgs.concat([{ typ: 'kollege', text: s.voll }], s.rest) }); }
      else self.setState({ kcStream: { voll: s.voll, n: n, rest: s.rest } });
    }, 30);
  }
  kcVals() {
    var self = this, st = this.state, cfg = this.kcCfg();
    var msgs = (st.kcMsgs || []).slice();
    if (st.kcStream) msgs.push({ typ: 'kollege', text: st.kcStream.voll.slice(0, st.kcStream.n), streamt: true });
    return {
      sidebarChats: this.kgChats(),
      kcName: cfg.name, kcKontext: cfg.name + ' · ' + cfg.anzahl, kcPlatzhalter: cfg.platzhalter,
      kcOffen: !!st.kcOffen, kcLaden: !!st.kcLaden,
      kcMsgs: msgs.map(function (m) { return Object.assign({ istDu: m.typ === 'du', istKollege: m.typ === 'kollege', istAussage: m.typ === 'aussage', istKarte: m.typ === 'karte', istLuecke: m.typ === 'luecke', streamt: false }, m); }),
      kcSenden: function (t) { self.kcSenden(t); },
      kcZu: function () { self.setState({ kcOffen: false }); },
      kcAuf: function () { self.setState({ kcOffen: true }); },
      kcHatMsgs: (st.kcMsgs || []).length > 0,
      kcPrivat: !!st.kcPrivat,
      kcPrivatToggle: function () { self.setState({ kcPrivat: !self.state.kcPrivat }); },
      kcNotizen: st.kcNotizen || []
    };
  }
  // „Gründungsteams · Solaro“ → Seite des Bereichs
  bereichHref(v) { var b = String(v || '').split(' · ')[0]; return ({ 'Gründungsteams': 'Gruendungsteams.dc.html', 'Events': 'Events.dc.html', 'Lehre': 'Lehre.dc.html', 'Social Media': 'SocialMedia.dc.html' })[b] || 'Main.dc.html'; }
  zuordnungen() { return ['Gründungsteams · Solaro', 'Gründungsteams · Kitchen Loop', 'Gründungsteams · Nordlicht Analytics', 'Gründungsteams · Greenbyte', 'Gründungsteams · Lern-App (Max Brandt)', 'Events · Gründungsnacht 2026', 'Events · Pitch-Abend', 'Lehre · Entrepreneurship Basics', 'Lehre · Design Thinking Workshop', 'Social Media · Pitch-Abend ankündigen', 'Social Media · Rückblick Sommerfest', 'Social Media · Porträt: Lisa Meier (Solaro)', '– (ohne Bereich)']; }
  // ——— Bearbeiten, Rückgängig, Prüfen (gemeinsam für alle Werkzeuge) ———
  basisState() { return { edits: {}, letzte: null, sel: null, pAuswahl: {}, pAlle: false, pWarumOffen: false, pWarum: '' }; }
  wert(id, feld, fallback) { var e = this.state.edits[id]; return e && e[feld] !== undefined ? e[feld] : fallback; }
  aendere(changes, label, ohneUndo) {
    var ed = Object.assign({}, this.state.edits), alt = [], self = this;
    changes.forEach(function (c) { ed[c.id] = Object.assign({}, ed[c.id]); alt.push({ id: c.id, feld: c.feld, vorher: self.wert(c.id, c.feld, c.basis) }); ed[c.id][c.feld] = c.wert; });
    this.setState({ edits: ed, letzte: { changes: alt, label: label, ohneUndo: !!ohneUndo } });
    clearTimeout(this._tt); this._tt = setTimeout(function () { self.setState({ letzte: null }); }, 9000);
  }
  toastVals() {
    var self = this, l = this.state.letzte;
    return {
      zeigeToast: !!l, toastText: l ? l.label : '', toastKannZurueck: !!l && !l.ohneUndo,
      toastZu: function () { self.setState({ letzte: null }); },
      toastUndo: function () {
        var l = self.state.letzte; if (!l) return;
        var ed = Object.assign({}, self.state.edits);
        l.changes.forEach(function (c) { ed[c.id] = Object.assign({}, ed[c.id]); ed[c.id][c.feld] = c.vorher; });
        self.setState({ edits: ed, letzte: null });
      }
    };
  }
  // Direkt bearbeitbare Felder: tippen speichert still, Verlassen des Feldes zeigt „Gespeichert · Rückgängig“
  feld(id, basis, name) {
    var self = this;
    return {
      fokus: function (e) { self._fokusAlt = e.target.value; },
      tippen: function (e) { var f = e.target.getAttribute('data-feld'); var ed = Object.assign({}, self.state.edits); ed[id] = Object.assign({}, ed[id]); ed[id][f] = e.target.value; self.setState({ edits: ed }); },
      fertig: function (e) {
        var f = e.target.getAttribute('data-feld'), neu = e.target.value, alt = self._fokusAlt;
        self._fokusAlt = undefined;
        if (alt === undefined || alt === neu) return;
        var ed = Object.assign({}, self.state.edits); ed[id] = Object.assign({}, ed[id]); ed[id][f] = alt;
        self.state.edits = ed;
        self.aendere([{ id: id, feld: f, wert: neu, basis: basis[f] }], 'Gespeichert' + (name ? ': ' + name : ''));
      },
      wahl: function (e) { var f = e.target.getAttribute('data-feld'); self.aendere([{ id: id, feld: f, wert: e.target.value, basis: basis[f] }], 'Gespeichert'); }
    };
  }
  // Filter „ungeprüft“: Mehrfachauswahl + Übernehmen / Verwerfen (+ optional Warum)
  pruefVals(items, gesamt, art) {
    var self = this, st = this.state;
    var offen = items.filter(function (i) { return i.ungeprueft && !self.wert(i.id, 'geprueft', ''); });
    var gewaehlt = st.pAlle ? offen : offen.filter(function (i) { return st.pAuswahl[i.id]; });
    var bulk = self.wert('_pruef', art, false);
    var rest = bulk ? 0 : Math.max(0, gesamt - (items.filter(function (i) { return i.ungeprueft; }).length - offen.length));
    var anzahl = st.pAlle ? rest : gewaehlt.length;
    var anwenden = function (wert) {
      var warum = self.state.pWarum.trim();
      var ch = gewaehlt.map(function (i) { return { id: i.id, feld: 'geprueft', wert: wert, basis: '' }; });
      if (self.state.pAlle) ch.push({ id: '_pruef', feld: art, wert: true, basis: false });
      self.aendere(ch,
        anzahl + ' ' + art + (wert === 'ok' ? ' übernommen' : ' verworfen') + (wert === 'weg' && warum ? ' · gemerkt: „' + warum + '“' : ''));
      self.setState({ pAuswahl: {}, pAlle: false, pWarumOffen: false, pWarum: '' });
    };
    return {
      pruefGesamt: rest, pruefAlle: st.pAlle,
      pruefAlleToggle: function () { self.setState({ pAlle: !self.state.pAlle, pAuswahl: {} }); },
      pruefZeile: anzahl ? anzahl + ' ausgewählt' : rest + ' ungeprüft · einzeln anhaken oder alle wählen',
      pruefHatAuswahl: anzahl > 0,
      pruefUebernehmen: function () { anwenden('ok'); },
      pruefWarumAuf: function () { self.setState({ pWarumOffen: !self.state.pWarumOffen }); },
      pruefWarumOffen: st.pWarumOffen && anzahl > 0,
      pruefWarum: st.pWarum, pruefWarumTippen: function (e) { self.setState({ pWarum: e.target.value }); },
      pruefVerwerfen: function (e) { if (e && e.preventDefault) e.preventDefault(); anwenden('weg'); },
      pruefWaehle: function (id) { return function () { var m = Object.assign({}, self.state.pAuswahl); m[id] = !m[id]; self.setState({ pAuswahl: m, pAlle: false }); }; },
      pruefIstGewaehlt: function (id) { return st.pAlle || !!st.pAuswahl[id]; }
    };
  }

  constructor(props) {
    super(props);
    this.state = { msgs: [], laden: false, stream: null, gesendet: false, antwort: null };
  }
  senden(text) {
    var self = this;
    this.setState({ msgs: this.state.msgs.concat([{ typ: 'du', text: text }]), laden: true });
    var voll = 'Verstanden: Beratung mit Solaro zum EXIST-Antrag. Pitchdeck bis Freitag, 02.10.';
    var rest = [
      { typ: 'karte', punkte: ['Zusage bei Solaro aktualisiert: Pitchdeck final bis Fr 02.10.', 'Aufgabe für dich: Kontakt zu Frau Weber vermitteln'], folgen: 'entfernt auch 1 Erinnerung' },
      { typ: 'klaerung' },
      { typ: 'entwurf' }
    ];
    self.vollText = voll;
    setTimeout(function () {
      self.setState({ laden: false, stream: { n: 0 } });
      var t = setInterval(function () {
        var s = self.state.stream; if (!s) { clearInterval(t); return; }
        var n = Math.min(voll.length, s.n + 4);
        if (n >= voll.length) { clearInterval(t); self.setState({ stream: null, msgs: self.state.msgs.concat([{ typ: 'kollege', text: voll }], rest) }); }
        else self.setState({ stream: { n: n } });
      }, 30);
    }, 900);
  }
  renderVals() {
    var self = this, st = this.state;
    var msgs = st.msgs.slice();
    if (st.stream) msgs.push({ typ: 'kollege', text: (this.vollText || '').slice(0, st.stream.n), streamt: true });
    return {
      titel: st.msgs.length ? 'Beratung Solaro' : 'Neuer Chat',
      leer: st.msgs.length === 0,
      laden: st.laden,
      antworten: ['Ja', 'Andere Person'],
      beantworten: function (a) { self.setState({ antwort: a }); },
      wartet: !st.antwort,
      wartetStil: st.antwort ? '' : 'opacity: 0.45; pointer-events: none',
      startText: 'Gerade Beratung mit Solaro gehabt, sie schicken bis Freitag das Pitchdeck, wir vermitteln Kontakt zu Frau Weber.',
      senden: function (t) { self.senden(t); },
      nachrichten: msgs.map(function (m) {
        return Object.assign({ punkte: [], folgen: '', streamt: false }, m, {
          istDu: m.typ === 'du', istKollege: m.typ === 'kollege', istKarte: m.typ === 'karte', istAussage: m.typ === 'aussage',
          istKlaerung: m.typ === 'klaerung', istEntwurf: m.typ === 'entwurf' && !st.gesendet && (!st.antwort || st.antwort === 'Ja'), istGesendet: m.typ === 'entwurf' && st.gesendet,
          gesendetPunkte: ['Mail an Anna Weber über dein Postfach gesendet'],
          senden: function () { self.setState({ gesendet: !self.state.gesendet }); }
        });
      })
    };
  }
}
</script>
</body>
